[project]
name = "a3-scia"
version = "0.1.0"
description = "A3 da unidade curricular Sistemas de Controle e Inteligencia Artificial"
authors = [
    {name = "Gustavo Adolfo",email = "gustavo.adolfo.as@gmail.com"}
]
requires-python = ">=3.13"
dependencies = [
    "pandas (>=3.1.0,<4.0.0)",
    "odfpy (>=1.4.1,<2.0.0)",
    "pytest (>=9.2.0,<10.0.0)",
    "pylint (>=4.1.3,<5.0.0)",
    "pep8 (>=1.7.1,<2.0.0)",
    "pyarrow (>=26.0.0,<27.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.4.0,<8.0.0)"
]
